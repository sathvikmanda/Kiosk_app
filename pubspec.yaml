name: kiosk
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  intl: ^0.19.0
  uuid: ^4.4.0
  http: ^1.2.0
  webview_flutter: ^4.7.0
  razorpay_flutter: ^1.3.7
  mobile_scanner: ^5.0.2
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/personal_drop.png
    - assets/images/delivery_drop.png
    - assets/images/otp_whatsapp_example.png

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
